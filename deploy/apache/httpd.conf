# Apache 2.4 configuration for the SAMD_QMS production front end (see compose.prod.yaml).
# Apache terminates HTTPS and proxies every request to the app container (gunicorn on port
# 8000 of the private Docker network). The site definitions are rendered from qms.conf.template
# by entrypoint.sh at start-up.

ServerRoot "/usr/local/apache2"
ServerName localhost
ServerTokens Prod
# The running server's process id: `httpd -k graceful` (used on certificate renewal) finds it here.
PidFile /usr/local/apache2/logs/httpd.pid
ServerSignature Off
TraceEnable off
Timeout 60
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
User daemon
Group daemon

# Ports: 80 (Let's Encrypt challenges and redirect), 443 (the public site), and 8443 (the
# administration site, published on the server's loopback interface for SSH tunnels only).
Listen 80
Listen 443
Listen 8443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# TLS session resumption (shared memory cache for all workers).
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
SSLSessionCacheTimeout 300
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# Request size and timing: the app allows 25 MB uploads, so allow a margin (as the previous proxy did).
LimitRequestBody 31457280
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\" %D" combined
CustomLog /proc/self/fd/1 combined

TypesConfig conf/mime.types

# The rendered site definitions (public site, redirect and administration site).
IncludeOptional conf/extra/qms.conf
