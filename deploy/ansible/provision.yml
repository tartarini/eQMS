# Provision a fresh Ubuntu 24.04 LTS (or Debian 12) server for SAMD_QMS.
#
#   ansible-playbook provision.yml --limit production
#
# Safe to re-run. Installs Docker, hardens SSH, enables the firewall and automatic security
# updates, creates the deploy user and directories, and schedules the off-site backup copy.
# Run it as a user with sudo; after the first run, log in as the deploy user with your key.
- name: Provision SAMD_QMS server
  hosts: qms
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check the operating system is supported
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
        fail_msg: "Supported: Ubuntu 22.04/24.04, Debian 12. Found {{ ansible_distribution }}."

    - name: Require at least one admin SSH key before disabling password logins
      ansible.builtin.assert:
        that: admin_ssh_keys | length > 0
        fail_msg: "Set admin_ssh_keys in group_vars, or you may lock yourself out."

  tasks:
    # --- base system ---------------------------------------------------------------
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, rsync, chrony]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Keep the clock in sync (timestamps in records and signatures)
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    # --- Docker (official repository) ----------------------------------------------
    - name: Add Docker's signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker's apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Configure the Docker daemon (log rotation, live restore)
      ansible.builtin.template:
        src: templates/daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Start Docker at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # --- deploy user and directories -------------------------------------------------
    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: [docker]
        append: true
        create_home: true

    - name: Authorise admin SSH keys for the deploy user
      ansible.builtin.lineinfile:
        path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
        line: "{{ item }}"
        create: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      loop: "{{ admin_ssh_keys }}"

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ qms_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Create the backup directory (written by the container user, uid 10001)
      ansible.builtin.file:
        path: "{{ backup_host_dir }}"
        state: directory
        owner: "10001"
        group: "{{ deploy_user }}"
        mode: "0770"

    # --- SSH and firewall --------------------------------------------------------------
    - name: Harden SSH
      ansible.builtin.template:
        src: templates/sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/50-samd-qms.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Firewall - default deny incoming, allow outgoing
      ansible.builtin.command: "ufw default {{ item }}"
      loop: ["deny incoming", "allow outgoing"]
      changed_when: false

    - name: Firewall - allow SSH, HTTP and HTTPS (HTTP/3 too)
      ansible.builtin.command: "ufw allow {{ item }}"
      loop: ["{{ ssh_port }}/tcp", "80/tcp", "443/tcp", "443/udp"]
      changed_when: false

    - name: Firewall - enable
      ansible.builtin.command: ufw --force enable
      changed_when: false

    - name: Start fail2ban (blocks repeated SSH login failures)
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # --- off-site backups (optional) ---------------------------------------------------
    - name: Schedule the nightly off-site copy of backups
      ansible.builtin.cron:
        name: samd_qms off-site backup
        user: "{{ deploy_user }}"
        minute: "15"
        hour: "4"
        job: >-
          rsync -a --delete-after -e "ssh -o BatchMode=yes"
          {{ backup_host_dir }}/ {{ backup_offsite_target }}
          || echo "off-site backup failed" | logger -t samd_qms
        state: "{{ 'present' if backup_offsite_target else 'absent' }}"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Restart ssh
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_distribution == 'Ubuntu' else 'sshd' }}"
        state: restarted
