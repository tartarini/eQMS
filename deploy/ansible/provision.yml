# Provision a fresh server for SAMD_QMS: Ubuntu 22.04/24.04, Debian 12, or Red Hat Enterprise
# Linux 9/10 (and compatible rebuilds that report themselves as RedHat).
#
#   ansible-playbook provision.yml --limit production
#
# Safe to re-run. Installs Docker, hardens SSH, enables the firewall and automatic security
# updates, creates the deploy user and directories, and schedules the off-site backup copy.
# Run it as a user with sudo; after the first run, log in as the deploy user with your key.
#
# Red Hat differences: dnf and firewalld replace apt and ufw; chrony and sshd have their
# Red Hat service names; EPEL supplies fail2ban and rclone; the Docker repository is the
# RHEL one. RHEL 10 support in Docker Engine is not confirmed by Docker at the time of
# writing, so check the Docker support matrix before relying on it in production.
- name: Provision SAMD_QMS server
  hosts: qms
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check the operating system is supported
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
            or (ansible_distribution == 'RedHat' and ansible_distribution_major_version in ['9', '10'])
        fail_msg: >-
          Supported: Ubuntu 22.04/24.04, Debian 12, Red Hat Enterprise Linux 9 and 10.
          Found {{ ansible_distribution }} {{ ansible_distribution_version }}.

    - name: Require at least one admin SSH key before disabling password logins
      ansible.builtin.assert:
        that: admin_ssh_keys | length > 0
        fail_msg: "Set admin_ssh_keys in group_vars, or you may lock yourself out."

  tasks:
    # --- base system ---------------------------------------------------------------
    - name: Import the EPEL signing key (Red Hat)
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install EPEL (fail2ban and rclone on Red Hat)
      ansible.builtin.dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: false
      when: ansible_os_family == 'RedHat'

    - name: Install base packages (Ubuntu and Debian)
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, rsync, chrony, openssh-server, cron]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install base packages (Red Hat)
      ansible.builtin.dnf:
        # curl itself is not listed: RHEL ships curl-minimal, which provides the curl command
        # and conflicts with the full curl package.
        name: [ca-certificates, firewalld, fail2ban, dnf-automatic, rsync, chrony, openssh-server, cronie]
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Enable automatic security updates (Ubuntu and Debian)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
      when: ansible_os_family == 'Debian'

    - name: Enable automatic security updates (Red Hat, security updates only)
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "^{{ item.key }} ="
        line: "{{ item.key }} = {{ item.value }}"
        create: false
      loop:
        - {key: upgrade_type, value: security}
        - {key: apply_updates, value: "yes"}
      when: ansible_os_family == 'RedHat'

    - name: Start the automatic security update timer (Red Hat)
      ansible.builtin.service:
        name: dnf-automatic-install.timer
        state: started
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Keep the clock in sync (timestamps in records and signatures)
      ansible.builtin.service:
        name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
        state: started
        enabled: true

    # --- Docker (official repository) ----------------------------------------------
    - name: Add Docker's signing key (Ubuntu and Debian)
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_os_family == 'Debian'

    - name: Add Docker's apt repository (Ubuntu and Debian)
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
      when: ansible_os_family == 'Debian'

    - name: Add Docker's dnf repository (Red Hat)
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/rhel/{{ ansible_distribution_major_version }}/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/rhel/gpg
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install Docker Engine and the Compose plugin (Red Hat)
      ansible.builtin.dnf:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Configure the Docker daemon (log rotation, live restore)
      ansible.builtin.template:
        src: templates/daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Start Docker at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # --- deploy user and directories -------------------------------------------------
    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: [docker]
        append: true
        create_home: true

    - name: Authorise admin SSH keys for the deploy user
      ansible.builtin.lineinfile:
        path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
        line: "{{ item }}"
        create: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      loop: "{{ admin_ssh_keys }}"

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ qms_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Create the backup directory (written by the container user, uid 10001)
      ansible.builtin.file:
        path: "{{ backup_host_dir }}"
        state: directory
        owner: "10001"
        group: "{{ deploy_user }}"
        mode: "0770"

    # --- SSH and firewall --------------------------------------------------------------
    - name: Create any missing SSH host keys (sshd will not validate without them)
      ansible.builtin.command: ssh-keygen -A
      changed_when: false

    - name: Create the SSH drop-in directory
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0755"

    - name: Harden SSH
      ansible.builtin.template:
        src: templates/sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/50-samd-qms.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Firewall - default deny incoming, allow outgoing (Ubuntu and Debian)
      ansible.builtin.command: "ufw default {{ item }}"
      loop: ["deny incoming", "allow outgoing"]
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: Firewall - allow SSH, HTTP and HTTPS (Ubuntu and Debian)
      ansible.builtin.command: "ufw allow {{ item }}"
      loop: ["{{ ssh_port }}/tcp", "80/tcp", "443/tcp"]
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: Firewall - enable (Ubuntu and Debian)
      ansible.builtin.command: ufw --force enable
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: Start firewalld at boot (Red Hat)
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Firewall - allow SSH, HTTP and HTTPS (Red Hat)
      ansible.builtin.command: "firewall-cmd --permanent {{ item }}"
      loop:
        - "--add-port={{ ssh_port }}/tcp"
        - "--add-service=http"
        - "--add-service=https"
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Reload firewalld rules (Red Hat)
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Start fail2ban (blocks repeated SSH login failures)
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # --- off-site backups (finding F5; required on production by deploy.yml) -------------
    - name: Check the off-site backup settings
      ansible.builtin.assert:
        that:
          - backup_offsite_method in ['', 'rsync', 'gdrive']
          - backup_offsite_method != 'rsync' or backup_offsite_target is match('^[^:]+:.+')
          - >-
            backup_offsite_method != 'gdrive' or (backup_gdrive_shared_drive_id | length > 0
            and vault_backup_gdrive_service_account_json | default('') | length > 0
            and vault_backup_crypt_password | default('') | length >= 24
            and vault_backup_crypt_salt | default('') | length >= 24)
        fail_msg: >-
          Off-site backups: backup_offsite_method is '', 'rsync' (set backup_offsite_target to
          user@host:/path/) or 'gdrive' (set backup_gdrive_shared_drive_id and, in the vault,
          vault_backup_gdrive_service_account_json, vault_backup_crypt_password and
          vault_backup_crypt_salt). See docs/deployment.md.
      no_log: true

    - name: Install rclone (Google shared drive backups)
      ansible.builtin.package:
        name: rclone
        state: present
      when: backup_offsite_method == 'gdrive'

    - name: Create the rclone configuration directory
      ansible.builtin.file:
        path: "{{ rclone_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"
      when: backup_offsite_method == 'gdrive'

    - name: Install the Google service account key
      ansible.builtin.copy:
        content: "{{ vault_backup_gdrive_service_account_json }}"
        dest: "{{ rclone_dir }}/gdrive-service-account.json"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      when: backup_offsite_method == 'gdrive'
      no_log: true

    - name: Obscure the encryption passwords for rclone
      ansible.builtin.command: rclone obscure -
      args:
        stdin: "{{ item.value }}"
      loop:
        - {name: password, value: "{{ vault_backup_crypt_password | default('') }}"}
        - {name: salt, value: "{{ vault_backup_crypt_salt | default('') }}"}
      register: rclone_obscured
      changed_when: false
      when: backup_offsite_method == 'gdrive'
      no_log: true

    - name: Write the rclone configuration
      ansible.builtin.template:
        src: templates/rclone.conf.j2
        dest: "{{ rclone_dir }}/rclone.conf"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      vars:
        rclone_crypt_password: "{{ rclone_obscured.results[0] }}"
        rclone_crypt_salt: "{{ rclone_obscured.results[1] }}"
      when: backup_offsite_method == 'gdrive'
      no_log: true

    - name: Install the off-site backup script
      ansible.builtin.template:
        src: templates/offsite-backup.sh.j2
        dest: "{{ qms_dir }}/offsite-backup.sh"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      when: backup_offsite_method != ''

    - name: Start the scheduler that runs the backups and the off-site copy
      ansible.builtin.service:
        name: "{{ 'crond' if ansible_os_family == 'RedHat' else 'cron' }}"
        state: started
        enabled: true

    - name: Schedule the nightly off-site copy of backups (after the 02:30 backup)
      ansible.builtin.cron:
        name: samd_qms off-site backup
        user: "{{ deploy_user }}"
        minute: "15"
        hour: "4"
        job: "{{ qms_dir }}/offsite-backup.sh >/dev/null 2>&1"
        state: "{{ 'present' if backup_offsite_method else 'absent' }}"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Restart ssh
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"
        state: restarted
