# Secrets. Copy to vault.yml, fill in, then encrypt:
#
#   cp vault.example.yml group_vars/qms/vault.yml
#   ansible-vault encrypt group_vars/qms/vault.yml   # uses ~/.samd_qms_vault_pass (see ansible.cfg)
#
# Generate random values with:  python3 -c "import secrets; print(secrets.token_urlsafe(48))"
# The database password must be letters, digits, - or _ only (it is placed in a URL).

vault_django_secret_key: "CHANGE-ME"
vault_postgres_password: "CHANGE-ME"
vault_smtp_password: "CHANGE-ME"

# Registry token able to pull the image (GitHub: a fine-grained token with read:packages).
# Leave empty if the image is public.
vault_registry_user: ""
vault_registry_token: ""

# Single sign-on client secrets (only for providers whose client id is set in vars.yml)
vault_sso_microsoft_secret: ""
vault_sso_google_secret: ""
vault_sso_github_secret: ""
vault_sso_orcid_secret: ""
vault_sso_linkedin_secret: ""

# Off-site backups to a Google shared drive (backup_offsite_method: gdrive). Leave empty
# otherwise. The key is the JSON of a Google Cloud service account that is a Content manager
# of the shared drive. The two crypt values encrypt the backups before upload (24+ random
# characters each); store a copy outside this server and vault too, or the off-site copies
# cannot be decrypted after a disaster.
vault_backup_gdrive_service_account_json: ""
vault_backup_crypt_password: ""
vault_backup_crypt_salt: ""
