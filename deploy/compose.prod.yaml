# Production stack for a single Linux server: Apache (HTTPS), app (gunicorn), scheduler
# (daily jobs and backups), certbot (Let's Encrypt certificates) and PostgreSQL. Installed to /opt/samd_qms by Ansible, which also
# writes .env (values substituted below) and app.env (application settings and secrets).
#
#   docker compose -f compose.prod.yaml up -d
#
# The database is on an internal network with no route out and no published port.
name: samd_qms

x-app: &app
  image: ${QMS_IMAGE:?set QMS_IMAGE}:${QMS_VERSION:?set QMS_VERSION}
  env_file: app.env
  environment:
    DATABASE_URL: postgres://qms:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/qms
    QMS_VERSION: ${QMS_VERSION}
    DJANGO_ALLOWED_HOSTS: ${QMS_DOMAIN:?set QMS_DOMAIN},app,127.0.0.1,localhost
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${QMS_DOMAIN}
    QMS_BASE_URL: https://${QMS_DOMAIN}
    QMS_ADMIN_HOSTS: localhost:8443     # Django admin only through the SSH tunnel (F7)
    DJANGO_DEBUG: "0"
    QMS_MIGRATE_ON_START: "0"
  volumes:
    - media:/data/media
    - ${BACKUP_HOST_DIR:-/var/backups/samd_qms}:/backups:z   # :z: SELinux (Red Hat family)
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend
    - web
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d qms"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256mb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    <<: *app
    # Health check comes from the image (GET /healthz).

  scheduler:
    <<: *app
    command: ["python", "manage.py", "run_scheduler"]
    healthcheck:
      disable: true

  web:
    # Apache 2.4 terminates HTTPS and proxies to the app. Configuration: deploy/apache/.
    build: ./apache
    entrypoint: ["/bin/sh", "/usr/local/bin/qms-entrypoint.sh"]
    environment:
      QMS_DOMAIN: ${QMS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8443:8443"   # admin site, for SSH tunnels only (finding F7)
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro,z
      - ./apache/qms.conf.template:/etc/apache2-templates/qms.conf.template:ro,z
      - ./apache/entrypoint.sh:/usr/local/bin/qms-entrypoint.sh:ro,z
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/certbot:ro
      - tls:/usr/local/apache2/tls
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  certbot:
    # Issues the Let's Encrypt certificate for QMS_DOMAIN, then renews it twice a day. Apache
    # picks up a renewed certificate itself (see deploy/apache/entrypoint.sh).
    image: certbot/certbot:v2.11.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until [ -s /etc/letsencrypt/live/$$QMS_DOMAIN/fullchain.pem ]; do
        certbot certonly --webroot -w /var/www/certbot -d $$QMS_DOMAIN
        -m $$ACME_EMAIL --agree-tos --non-interactive || sleep 3600; done;
        while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200; done
    environment:
      QMS_DOMAIN: ${QMS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

networks:
  backend:
    internal: true     # database traffic only; no internet access
  web:                 # Apache, certbot <-> app, and the app's outbound email and SSO calls

volumes:
  pgdata:
  media:
  letsencrypt:         # TLS certificates from Let's Encrypt; back up with the server
  acme_webroot:        # challenge files for certificate issuance and renewal
  tls:                 # self-signed certificates (administration site, first start)
