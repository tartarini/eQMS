# Continuous integration for SAMD_QMS.
#
# Every push and pull request: checks, the full test suite on PostgreSQL 16 with test coverage,
# OQ evidence (kept as a build artifact), infrastructure checks, and an image build with a smoke
# test. On main: the image is pushed as :main and :sha-<commit> (for staging), and the README
# badges (tests, coverage, OQ) are published to the `badges` branch.
# On a version tag (v1.0.0): the image is pushed as :1.0.0 — the tag you deploy and validate.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and OQ evidence
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qms
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qms -d qms" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://qms:qms@localhost:5432/qms
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Production settings check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: qms.example.org
          DJANGO_SECRET_KEY: ci-only-but-long-enough-to-pass-the-deployment-check-1234567890
        run: python manage.py check --deploy --fail-level ERROR

      - name: Operational qualification (all tests, traced to requirements, with coverage)
        run: >
          coverage run manage.py run_oq
          --release "${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}"
          --executed-by "GitHub Actions run ${{ github.run_id }} (${{ github.actor }})"
          --output oq_evidence

      - name: Keep the OQ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oq-evidence-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: oq_evidence/
          retention-days: 90

      - name: Coverage report
        id: coverage
        if: always() && hashFiles('.coverage') != ''
        run: |
          coverage json -q
          coverage html -q
          { echo "## Test coverage"; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
          coverage report --fail-under=75 --format=total > /dev/null \
            || { echo "::error::Test coverage fell below 75%"; exit 1; }

      - name: Badges
        if: always() && hashFiles('coverage.json', 'oq_evidence/oq_results.json') != ''
        run: python .github/scripts/badges.py coverage.json oq_evidence/oq_results.json badges

      - name: Keep the coverage report and badges
        if: always() && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            htmlcov/
            coverage.json
            badges/
          retention-days: 30

  badges:
    name: Publish badges
    needs: [test]
    # Only from main, and also when tests fail, so the badges show it.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # this job only: pushes the badge images to the `badges` branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: result

      - name: Push to the badges branch
        run: |
          git init -q site && cd site
          git checkout -q --orphan badges
          cp ../result/badges/*.svg .
          printf '# Badges\n\nWritten by CI from %s (run %s). Do not edit.\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Badges for ${GITHUB_SHA::12}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" badges

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install checkers
        run: pip install ansible-core shellcheck-py

      - name: Shell scripts
        run: shellcheck deploy/scripts/*.sh

      - name: Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          cp deploy/env/app.env.example deploy/app.env
          QMS_IMAGE=ghcr.io/example/samd_qms QMS_VERSION=1.0.0 POSTGRES_PASSWORD=x \
          QMS_DOMAIN=qms.example.org ACME_EMAIL=ops@example.org \
            docker compose -f deploy/compose.prod.yaml config --quiet

      - name: Ansible playbooks
        working-directory: deploy/ansible
        run: |
          cp inventory.example.ini inventory.ini
          cp vault.example.yml group_vars/qms/vault.yml
          echo ci > "$RUNNER_TEMP/vaultpass"
          for p in provision.yml deploy.yml restore-test.yml; do
            ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/vaultpass" ansible-playbook --syntax-check "$p"
          done

  image:
    name: Build image
    needs: [test, infrastructure]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samd_qms" >> "$GITHUB_ENV"

      - name: Release label
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "QMS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "QMS_VERSION=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: samd_qms:ci
          build-args: |
            QMS_VERSION=${{ env.QMS_VERSION }}
            QMS_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_DEBUG=0 -e DJANGO_SECRET_KEY=smoke-test-only \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 -e QMS_MIGRATE_ON_START=1 \
            samd_qms:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q "\"version\": \"${QMS_VERSION}\""
          curl -fsS http://127.0.0.1:8000/healthz | grep -q "\"commit\": \"${GITHUB_SHA}\""
          docker exec smoke id -u | grep -qx 10001   # runs as the unprivileged user
          docker logs smoke | tail -20
          docker rm -f smoke

      - name: Scan the image for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: samd_qms:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QMS_VERSION=${{ env.QMS_VERSION }}
            QMS_COMMIT=${{ github.sha }}
          cache-from: type=gha
